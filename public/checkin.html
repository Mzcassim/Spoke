<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check-in — Spoke.</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#f0ede6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px}
h1{font-size:20px;font-weight:600;margin-bottom:4px}
.count{font-size:14px;color:#888;margin-bottom:20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:#666;font-weight:500;padding:8px 12px;border-bottom:1px solid #222}
td{padding:8px 12px;border-bottom:1px solid #161616}
tr:first-child td{background:rgba(240,237,230,0.03)}
.status{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block}
.ws-status{position:fixed;top:12px;right:12px;font-size:11px;color:#555}
</style>
</head>
<body>
<h1>Check-in</h1>
<div class="count" id="count">0 guests registered</div>
<div class="ws-status" id="wsStatus">connecting…</div>

<table>
  <thead>
    <tr><th>ID</th><th>Name</th><th>Role</th><th>Time</th></tr>
  </thead>
  <tbody id="guestTable"></tbody>
</table>

<script>
(function(){
  var table = document.getElementById('guestTable');
  var countEl = document.getElementById('count');
  var wsStatus = document.getElementById('wsStatus');
  var guestCount = 0;
  var token = new URLSearchParams(window.location.search).get('token');

  function formatTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function addRow(g, prepend) {
    var tr = document.createElement('tr');
    tr.innerHTML = '<td>' + g.wristband_id + '</td><td>' + g.name + '</td><td>' + g.role + '</td><td>' + formatTime(g.registered_at || new Date().toISOString()) + '</td>';
    if (prepend && table.firstChild) {
      table.insertBefore(tr, table.firstChild);
    } else {
      table.appendChild(tr);
    }
  }

  function updateCount(n) {
    guestCount = n;
    countEl.textContent = n + ' guest' + (n !== 1 ? 's' : '') + ' registered';
  }

  // Load existing guests
  fetch('/api/guests?token=' + token)
    .then(function(r){ return r.json(); })
    .then(function(guests) {
      updateCount(guests.length);
      guests.forEach(function(g){ addRow(g, false); });
    });

  // WebSocket
  function connectWS() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var ws = new WebSocket(proto + '//' + location.host);
    ws.onopen = function() { wsStatus.textContent = 'live'; wsStatus.style.color = '#4ade80'; };
    ws.onclose = function() { wsStatus.textContent = 'reconnecting…'; wsStatus.style.color = '#555'; setTimeout(connectWS, 3000); };
    ws.onmessage = function(e) {
      var msg = JSON.parse(e.data);
      if (msg.type === 'new_guest') {
        guestCount++;
        updateCount(guestCount);
        addRow(msg.guest, true);
      }
    };
  }
  connectWS();
})();
</script>
</body>
</html>
