<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>You're in — Spoke</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#f0ede6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;text-align:center}
.container{max-width:380px}
h1{font-size:40px;font-weight:600;margin-bottom:16px}
.sub{font-size:18px;color:#ccc;margin-bottom:24px;line-height:1.5}
.hint{font-size:14px;color:#555;line-height:1.5}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.container{animation:fadeUp 0.5s ease}
</style>
</head>
<body>
<div class="container">
  <h1>You're in.</h1>
  <p class="sub">Tap your phone to someone's wristband to connect.</p>
  <p class="hint">The graph on the screen updates in real time.</p>
</div>
</body>
</html>
